retry_hazard:
  operation: sendLetter
  severity: high
  description: >-
    POST /send has a PHYSICAL, irreversible consequence — a card is written and mailed — and
    Handwrite publishes no idempotency key. A blind retry after a 500 or a timeout can mail the
    same card twice, and the docs state Handwrite does "not allow cancellations typically".
    Agents must treat /send as at-most-once: on an ambiguous failure, reconcile with
    GET /order/{orderId} before resending.
