    note: >-
      Live probes returned a single-key body, e.g. {"message":"No token provided. Please make
      sure to include it in your headers, e.g. Authorization: test_HW_..."} on 401 and
      {"message":"Not Found!"} on 404.
  declared_in_openapi:
    error: string
    message: string
    note: >-
      The Error schema in openapi/ declares both `error` and `message`. Only `message` was
      observed on the wire in the 2026-08-13 probes; `error` is where the documented
      `rate_limit_exceeded` code is expected to appear on a 429.
