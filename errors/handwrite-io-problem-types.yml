format: custom-json
rfc9457: false
media_type: application/json
description: >-
  Handwrite publishes a conventional HTTP response-code table and returns a plain JSON body on
  error. It does NOT use RFC 9457 problem+json — no `type`, `title`, `status`, `detail`,
  `instance` members and no application/problem+json media type. There is no published catalog
  of machine-readable error CODES beyond the one named string `rate_limit_exceeded`; most
  failures are distinguishable only by HTTP status plus a human-readable `message`.
