description: >-
  Handwrite publishes NO changelog, release notes, or version history page. Neither the docs
  site nor the marketing site has one, and there is no dated entry list anywhere on a Handwrite
  domain. What follows is reconstructed from the public commit history of Handwrite's own Slate
  documentation repository, github.com/handwriteio/API-Docs — a real, dated, provider-authored
  record of documented API changes, but NOT a changelog the provider offers to consumers. For
  that reason NO `ChangeLog` pointer is wired into apis.yml: the artifact records the absence and
  the evidence behind it, and asserting a ChangeLog pointer would credit Handwrite with a surface
  they do not publish.
