free_tier:
  offered: false
  note: >-
    The site's primary CTA reads "START FOR FREE", but that is free ACCOUNT CREATION, not free
    cards — the pricing page's own subhead is "Create your account and start sending in minutes
    for under $3 a card." Separately, the API issues test_hw keys whose usage is not billed
    (see sandbox/handwrite-io-sandbox.yml); test keys do not produce mailed cards.
not_published:
  - API request quotas or per-request pricing
  - published rate-limit tiers tied to a paid plan (the 60 rpm limit is flat for every key)
  - SLA or support tiers
  - international / non-US postage pricing
