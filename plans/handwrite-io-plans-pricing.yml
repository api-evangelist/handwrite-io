description: >-
  Handwrite's published pricing, read verbatim from https://www.handwrite.io/pricing on
  2026-08-13. This supersedes an API Evangelist scaffold (method: generated, 2026-05-04) that
  invented Free/Professional/Enterprise request-quota tiers Handwrite does not sell.
  IMPORTANT SHAPE: Handwrite does NOT price the API. It prices the physical artifact — one
  handwritten card, mailed — on a single volume-banded per-card rate that applies whether the
  card is ordered through the web app or through the REST API. There is no request quota, no
  API subscription, and no per-call charge. API access is included with any account; the docs
  state "You will be charged per card based on the plan you choose."
pricing_model: per-unit volume banded
unit: card
unit_includes:
  - the card
  - the envelope
  - the handwriting
  - postage
currency: USD
plan_count: 5
