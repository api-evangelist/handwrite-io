  note: >-
    Artifacts exist in this repo for these, but no apis.yml pointer is wired, because the
    pointer would assert that HANDWRITE publishes the surface. Each was probed on 2026-08-13.
  withheld:
    - type: WellKnown
      artifact: well-known/handwrite-io-well-known.yml
      reason: every /.well-known/ path returned 404 on all four Handwrite hosts
    - type: SecurityTxt
      artifact: well-known/handwrite-io-well-known.yml
      reason: /.well-known/security.txt returned 404 on all four hosts
    - type: MCPServer
      artifact: mcp/handwrite-io-mcp.yml
      reason: >-
        no server exists; the file is an API Evangelist candidate tool list derived from the
        OpenAPI (deployment.mode = none), and mcp.handwrite.io is NXDOMAIN
    - type: AgentCard
      artifact: none
      reason: >-
        /.well-known/agent-card.json and /.well-known/agent.json returned 404 on all four hosts;
        per pipeline rule no stub was authored
    - type: ChangeLog
      artifact: changelog/handwrite-io-changelog.yml
      reason: >-
        Handwrite publishes no changelog; the artifact reconstructs history from their own
        API-Docs commit log and records the absence
    - type: StatusPage
      artifact: lifecycle/handwrite-io-lifecycle.yml
      reason: >-
        status.handwrite.io is NXDOMAIN and handwrite.statuspage.io 200s only because it
        redirects to Atlassian marketing — a soft-200, not a status page
    - type: Deprecation
      artifact: lifecycle/handwrite-io-lifecycle.yml
      reason: no deprecation or sunset policy published; no RFC 8594 headers observed
    - type: Idempotency
      artifact: conventions/handwrite-io-conventions.yml
      reason: >-
        no idempotency key is supported, which is a material hazard on POST /send rather than a
        scoring nicety
    - type: SDKs
      artifact: packages/handwrite-io-packages.yml
      reason: >-
        zero first-party client libraries in any registry; the only installable client is a
        community Elixir package last released 2020-11-14
    - type: Compliance
      artifact: conformance/handwrite-io-conformance.yml
      reason: no certifications, trust center, terms of service or privacy policy published
    - type: Security
      artifact: none
      reason: >-
        probe-security-programs.py found no vulnerability disclosure program and no trust center
    - type: Webhooks
      artifact: none
      reason: no webhook, callback or event surface exists; order status is polling-only
    - type: TermsOfService / PrivacyPolicy
      artifact: none
      reason: >-
        /terms, /terms-of-service, /privacy, /privacy-policy, /legal all 404 on www.handwrite.io
        and app.handwrite.io; the site sitemap lists 15 URLs and contains no legal page
