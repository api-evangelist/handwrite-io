aid: handwrite-io
name: Handwrite IO
description: >-
  Handwrite is a South Carolina based direct-mail service that writes and mails real handwritten
  cards on demand, and exposes that fulfillment as a small REST API at https://api.handwrite.io/v1.
  Four operations cover the whole surface: list the handwriting styles on the account, list the
  stationery and card options, send a card to between one and ten US recipients (or up to 1,000
  orders in a single batch request), and fetch an order to follow it from processing through
  written to complete and retrieve proof images of the finished card and envelope. Authentication
  is a single static API key sent raw in the Authorization header, prefixed test_hw for unbilled
  test-mode calls or live_hw for calls that actually mail and bill. Pricing is per mailed card
  rather than per API call, from $2.99 down to $2.45 by volume, with the card, envelope,
  handwriting and postage included. The API is rate limited to 60 requests per minute per key.
  Handwrite also ships a Zapier integration for teams that do not want to write code.
url: https://raw.githubusercontent.com/api-evangelist/handwrite-io/refs/heads/main/apis.yml
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Paid per card · Self-serve signup · Unbilled test mode
  confidence: high
  source:
  - plans
  - authentication
  - sandbox
  generated: '2026-08-13'
  method: derived
  note: >-
    Corrected from `freemium` on 2026-08-13. The site CTA reads "START FOR FREE", but that is
    free account creation — every mailed card is billed, and Handwrite publishes no free card
    allowance. The free-feeling surface is test mode (test_hw keys), which exercises the API
    without billing and without mailing anything.
